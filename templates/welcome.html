{% load static %}
<!DOCTYPE html>
<html lang="th">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Smart Menu - ยินดีต้อนรับ</title>
    <link
        href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;600;700&family=Prompt:wght@300;400;500;600&display=swap"
        rel="stylesheet">
    <link rel="stylesheet" href="{% static 'style.css' %}">
    <style>
        .split-container {
            display: flex;
            height: 100vh;
            align-items: center;
            justify-content: center;
            gap: 2rem;
            padding: 2rem;
            flex-wrap: wrap;
        }

        .role-card {
            flex: 1;
            min-width: 300px;
            max-width: 400px;
            padding: 4rem 2rem;
            text-align: center;
            cursor: pointer;
        }

        .role-card h2 {
            font-size: 2.5rem;
            margin-bottom: 1rem;
        }

        .staff-form {
            display: none;
            margin-top: 1.5rem;
        }

        .staff-form input {
            width: 100%;
            padding: 1rem;
            margin-bottom: 1rem;
            border-radius: 8px;
            border: 1px solid rgba(255, 255, 255, 0.2);
            background: rgba(0, 0, 0, 0.4);
            color: white;
            font-family: inherit;
        }
    </style>
</head>

<body>
    <div class="background-blob"></div>
    <div class="background-blob blob-2"></div>

    <div class="split-container">
        <!-- ลูกค้า -->
        <div class="role-card glass-card" onclick="window.location.href='/customer/'">
            <h2>🍽️ ลูกค้า</h2>
            <p style="color: #94a3b8;">คลิกเพื่อเข้าสู่หน้าสั่งอาหารออนไลน์</p>
        </div>

        <!-- พนักงาน -->
        <div class="role-card glass-card" id="staff-card" onclick="showStaffForm()">
            <h2>👨‍🍳 พนักงาน</h2>
            <p style="color: #94a3b8;">คลิกเพื่อเข้าสู่ระบบหลังร้าน (เพิ่มเมนู / รับออเดอร์)</p>

            <form class="staff-form" id="staff-form" action="/staff_login/" method="POST">
                {% if error %}<p style="color: #ef4444; margin-bottom: 1rem; font-weight: bold;">{{ error }}</p>{% endif %}
                <input type="password" name="password" placeholder="รหัสผ่าน" required
                    onclick="event.stopPropagation()">
                <button type="submit" class="order-btn" onclick="event.stopPropagation()">เข้าสู่ระบบพนักงาน</button>
            </form>
        </div>
    </div>

    <script>
        // ถ้าใส่รหัสผิดมา ให้โชว์ฟอร์มค้างไว้เลย
        {% if error %}
        document.getElementById('staff-form').style.display = 'block';
        {% endif %}

        function showStaffForm() {
            document.getElementById('staff-form').style.display = 'block';
        }
    </script>
</body>

</html>
